kind = "web"
previewPath = "/"
title = "Gerador de Cidades — Forgotten Realms"
version = "1.0.0"
id = "artifacts/forgotten-realms"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20101

[services.development]
run = "pnpm --filter @workspace/forgotten-realms run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/forgotten-realms", "run", "build" ]
publicDir = "artifacts/forgotten-realms/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20101"
BASE_PATH = "/"
